<html>
    <head>
        <title>Form in HTML</title>
    </head>
    <body>
        <h1><b>Form in HTML</b></h1>
        <form>
            <table border="5px">
            <tr>
                <td>Username:</td>
                <td><input type ="text" name="username" placeholder="Enter your username"></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type ="text" name="password" placeholder="Enter your password" </td>
            </tr>
            <tr>
                <td>Phone Number:</td>
                <td><input type="number" name="Phone no."</td>
            </tr>
            <tr> 
                <td>Hobby:</td>
                <td><input type="checkbox" name ="workout">Workout <br>
                <input type="checkbox" name ="music">Music <br></td>
            </tr>
            <tr>
                <td>Natural Gender:</td>
                <td><input type ="radio" name="gender" value="male">Male<br>
                <input type ="radio" name="gender" value="Female">Female<br></td>
            </tr>
            <tr>
                <td>Country:</td>
                <td>Select Country:
                    <select>
                        <option value="Portugal">Portugal</option>
                        <option value="Nepal">Nepal</option>
                        <option value="Switzerland">Switzerland</option>
                        <option value="Norway">Norway</option>
                        <option value="France">France</option>
                        <option value="Japan">Japan</option>
                        
                    </select>
                </td>
            </tr>
            </table>
        </form>
    </body>
</html>
